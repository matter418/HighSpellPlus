name: Build/release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'
    branches:
      - staging

permissions:
  contents: write

jobs:
  get_version:
    runs-on: ubuntu-latest
    outputs:
      full_version: ${{ steps.version.outputs.full_version }}
      tag_name: ${{ steps.version.outputs.tag_name }}
      release_name: ${{ steps.version.outputs.release_name }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      draft: ${{ steps.version.outputs.draft }}
      base_version: ${{ steps.version.outputs.base_version }}
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: Get version and determine release properties
        id: version
        run: |
          BASE_VERSION=$(node -p "require('./package.json').version")
          
          # Manual staging run
          if [[ "${{ github.event_name }}" == 'workflow_dispatch' && "${{ github.ref_name }}" == 'staging' ]]; then
            DRAFT="false"
            PRERELEASE="true"
            TAG_NAME="v${BASE_VERSION}-beta.${{ github.run_id }}"
            RELEASE_NAME="Staging Build ${TAG_NAME}"
            FULL_VERSION="${BASE_VERSION}-beta.${{ github.run_id }}"

          # Manual branch run
          elif [[ "${{ github.event_name }}" == 'workflow_dispatch' && "${{ github.ref_name }}" != 'staging' && "${{ github.ref_name }}" != 'main' ]]; then
            DRAFT="true"
            PRERELEASE="false"
            TAG_NAME="v${BASE_VERSION}-test.${{ github.run_id }}"
            RELEASE_NAME="Test Build ${TAG_NAME}"
            FULL_VERSION="${BASE_VERSION}-test.${{ github.run_id }}"

          # Staging branch
          elif [[ "${{ github.ref_name }}" == 'staging' ]]; then
            DRAFT="false"
            PRERELEASE="true"
            TAG_NAME="v${BASE_VERSION}-beta.${{ github.run_number }}"
            RELEASE_NAME="Staging Build ${TAG_NAME}"
            FULL_VERSION="${BASE_VERSION}-beta.${{ github.run_number }}"
          
          # Tag push (proper release)
          elif [[ "${{ github.ref_type }}" == 'tag' ]]; then
            DRAFT="false"
            PRERELEASE="false"
            TAG_NAME="${{ github.ref_name }}"
            RELEASE_NAME="Release ${{ github.ref_name }}"
            FULL_VERSION=$(echo "${{ github.ref_name }}" | sed 's/^v//')
          fi

          echo "full_version=${FULL_VERSION}" >> $GITHUB_OUTPUT
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "release_name=${RELEASE_NAME}" >> $GITHUB_OUTPUT
          echo "prerelease=${PRERELEASE}" >> $GITHUB_OUTPUT
          echo "draft=${DRAFT}" >> $GITHUB_OUTPUT

  build:
    needs: get_version
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      
      - name: Install Node.js, NPM and Yarn
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
      
      # The Windows runner image ships Yarn 1.22 as an npm global that sits ahead of Node's
      # Corepack shims on PATH, so a bare `corepack enable` leaves `yarn` at 1.22 and the
      # install refuses the project's Yarn 4 (release v1.0.10 run 41723920774). Installing
      # Corepack through npm puts its shims in that same global folder, replacing them.
      - name: Enable Corepack
        run: |
          npm install -g corepack@latest
          corepack enable
          yarn --version

      - name: Set Package Version
        run: npm pkg set version=${{ needs.get_version.outputs.full_version }}
      
      - name: Install Package Dependencies
        run: yarn install --frozen-lockfile
      
      - name: Build
        run: yarn run build
      
      - name: Package Application
        run: yarn run release --publish never
        if: ${{ !env.ACT }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      # Both Linux arches used to share one file name, so the arm64 AppImage silently
      # replaced the x64 one in every release. Fail here if the x64 build is not x86-64.
      - name: Check AppImage architectures
        if: ${{ runner.os == 'Linux' && !env.ACT }}
        run: |
          set -e
          ls -l dist/*.AppImage
          for f in dist/*-x86_64.AppImage; do
            file "$f" | grep -q 'x86-64' || { echo "::error::$f is not an x86-64 binary"; exit 1; }
          done
          for f in dist/*-arm64.AppImage; do
            file "$f" | grep -q 'aarch64' || { echo "::error::$f is not an aarch64 binary"; exit 1; }
          done

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        if: ${{ !env.ACT }}
        with:
          name: build-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.AppImage
            dist/*.exe
            dist/*.yml
            dist/*.blockmap

  release:
    needs: [build, get_version]
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag' || github.ref_name == 'staging' || github.event_name == 'workflow_dispatch'

    steps:      
      - name: Check out Git repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Every release carries notes: one bullet per commit since the previous release tag,
      # plus a compare link. Commit subjects are therefore user-facing text.
      - name: Write release notes
        id: notes
        run: |
          CURRENT="${{ needs.get_version.outputs.tag_name }}"
          PREVIOUS=$(git tag --list 'v*' --sort=-v:refname | grep -v "^${CURRENT}$" | head -n 1)
          {
            echo "## What changed"
            echo
            if [ -n "$PREVIOUS" ]; then
              git log --no-merges --format='- %s' "${PREVIOUS}..${GITHUB_SHA}"
              echo
              echo "**Full changelog:** https://github.com/${GITHUB_REPOSITORY}/compare/${PREVIOUS}...${CURRENT}"
            else
              git log --no-merges --format='- %s' -n 20 "${GITHUB_SHA}"
            fi
          } > release-notes.md
          cat release-notes.md

      - name: Download all artifacts
        if: ${{ !env.ACT }}
        uses: actions/download-artifact@v8
        with:
          path: dist

      - name: List downloaded files (for debugging)
        if: ${{ !env.ACT }}
        run: ls -R dist

      - name: Create GitHub Release
        if: ${{ !env.ACT }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.get_version.outputs.tag_name }}
          RELEASE_NAME: ${{ needs.get_version.outputs.release_name }}
          DRAFT: ${{ needs.get_version.outputs.draft }}
          PRERELEASE: ${{ needs.get_version.outputs.prerelease }}
        run: |
          FLAGS=()
          [ "$DRAFT" = "true" ] && FLAGS+=(--draft)
          [ "$PRERELEASE" = "true" ] && FLAGS+=(--prerelease)
          gh release create "$TAG_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_NAME" \
            --notes-file release-notes.md \
            "${FLAGS[@]}"

      - name: Upload All Release Assets (CLI)
        if: ${{ !env.ACT }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ needs.get_version.outputs.tag_name }} \
            ./dist/**/*.dmg \
            ./dist/**/*.AppImage \
            ./dist/**/*Setup*.exe \
            ./dist/**/latest*.yml \
            ./dist/**/*.blockmap

      - name: Output Expected Filenames for ACT
        if: ${{ env.ACT }}
        run: |
          echo "--- ACT Local Test Output ---"
          echo "Version: ${{ needs.get_version.outputs.full_version }}"
          echo "Calculated Tag Name: ${{ needs.get_version.outputs.tag_name }}"
          echo "Calculated Release Name: ${{ needs.get_version.outputs.release_name }}"
          echo "Calculated Prerelease Status: ${{ needs.get_version.outputs.prerelease }}"
          echo "--- Expected Asset Names ---"
          echo "Windows: HighspellPlus-Setup-${{ needs.get_version.outputs.full_version }}.exe"
          echo "macOS: HighspellPlus-${{ needs.get_version.outputs.full_version }}.dmg"
          echo "Linux x64: HighspellPlus-${{ needs.get_version.outputs.full_version }}-x86_64.AppImage"
          echo "Linux arm64: HighspellPlus-${{ needs.get_version.outputs.full_version }}-arm64.AppImage"
          echo "--- NOTE: Actual file paths depend on local build output in 'dist/' ---"
