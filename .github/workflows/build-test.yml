name: Build (Status Check)

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build (Status Check)
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7

      - name: Install Node.js, NPM and Yarn
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      # The Windows runner image ships Yarn 1.22 as an npm global that sits ahead of Node's
      # Corepack shims on PATH, so a bare `corepack enable` leaves `yarn` at 1.22 and the
      # install refuses the project's Yarn 4 (release v1.0.10 run 41723920774). Installing
      # Corepack through npm puts its shims in that same global folder, replacing them.
      - name: Enable Corepack
        run: |
          npm install -g corepack@latest
          corepack enable
          yarn --version

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build application
        run: yarn build

      # Sanity check: make sure yarn start runs successfully
      - name: Test yarn start (Unix)
        if: runner.os != 'Windows'
        run: |
          yarn start &
          APP_PID=$!
          sleep 10
          kill $APP_PID || true
      
      - name: Test yarn start (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Start-Process -FilePath "yarn" -ArgumentList "start"
          Start-Sleep -Seconds 10
          Get-Process -Name "electron" -ErrorAction SilentlyContinue | Stop-Process -Force


      # Dry run build (no upload, no publish)
      - name: Dry run Electron build
        run: yarn electron-builder --dir
        env:
          NODE_ENV: production
